# apps.conf — which app lives on which space, and which ones open at login.
#
# Read by place-apps.sh (called from ~/.yabairc). Takes effect on the next
# `yabai --restart-service`; check it first with:  ~/.config/yabai/place-apps.sh check
#
# One app per line, five columns separated by |:
#
#   space | launch | app | bundle id | url(s)
#
#   space      1-9 = always put this app's windows on that space (a yabai rule,
#              also mid-session). "-" = no rule, leave its windows alone.
#   launch     yes = open it at login if it isn't running. no = only the rule.
#   app        the name macOS shows in the Dock / app switcher. That is NOT
#              always the .app filename: Things3.app is "Things", Beeper
#              Desktop.app is "Beeper", Visual Studio Code is "Code".
#              Check with:  yabai -m query --windows | jq -r '.[].app' | sort -u
#   bundle id  optional. Leave empty and it is looked up from the name; only
#              needed when that fails (`place-apps.sh check` tells you).
#              Find one with:  osascript -e 'id of app "Name"'
#   url(s)     optional, space-separated. Opened with the app, but only when
#              it gets launched here — a start-of-the-day thing, not an
#              every-restart thing.
#
# Lines starting with # are ignored, so commenting a line out removes the app
# entirely (no rule, no launch).

